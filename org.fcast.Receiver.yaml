app-id: org.fcast.Receiver
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-nightly
  - org.freedesktop.Sdk.Extension.llvm20

command: fcast-receiver
finish-args:
  - --share=network
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # - --talk-name=org.kde.StatusNotifierWatcher
  # - --system-talk-name=org.fcast.Receiver
modules:
  - name: libseat
    buildsystem: meson
    config-opts:
      - -Dexamples=disabled
      - -Dman-pages=disabled
    sources:
      - type: git
        url: https://git.sr.ht/~kennylevinsen/seatd
        tag: 0.9.2
        commit: a3c56c324c3a84474cc1615d94ccd6a6255d0c10

  - name: libevdev
    buildsystem: meson
    config-opts:
      - -Dtests=disabled
      - -Ddocumentation=disabled
    sources:
      - type: archive
        url: https://www.freedesktop.org/software/libevdev/libevdev-1.13.6.tar.xz
        sha256: 73f215eccbd8233f414737ac06bca2687e67c44b97d2d7576091aa9718551110

  - name: libxkbcommon
    buildsystem: meson
    config-opts:
      - -Denable-wayland=true
      - -Denable-x11=true
      - -Denable-docs=false
    sources:
      - type: archive
        url: https://github.com/xkbcommon/libxkbcommon/archive/refs/tags/xkbcommon-1.13.1.tar.gz
        sha256: aeb951964c2f7ecc08174cb5517962d157595e9e3f38fc4a130b91dc2f9fec18

  - name: libinput
    buildsystem: meson
    config-opts:
      - -Dmtdev=false
      - -Ddebug-gui=false
      - -Dtests=false
      - -Dlibwacom=false
      - -Ddocumentation=false
    sources:
      - type: archive
        url: https://gitlab.freedesktop.org/libinput/libinput/-/archive/1.30.0/libinput-1.30.0.tar.gz
        sha256: fcce701746b8f5ee57c6724e963496d2223a9639856c6d1b811cff38e6dd4465

  - name: gst-plugins-good
    buildsystem: meson
    config-opts:
      - -Ddoc=disabled
      - -Dtests=disabled
    sources:
      - type: archive
        url: https://gstreamer.freedesktop.org/src/gst-plugins-good/gst-plugins-good-1.26.9.tar.xz
        sha256: f38566fb53ae56b7019a039475311756a28eb978a781154d67813dcb551ff5fe

  - name: fcast-receiver
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-nightly/bin:/usr/lib/sdk/llvm20/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
      env:
        CARGO_HOME: /run/build/fcast-receiver/cargo
        CARGO_NET_OFFLINE: 'true'
        SKIA_BINARIES_URL: file:///run/build/fcast-receiver/skia-binaries/skia-binaries-b98dbc3ef012d6f67535-x86_64-unknown-linux-gnu-gl-pdf-textlayout-vulkan.tar.gz
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo build --offline --release -p desktop-receiver
      - install -Dm0755 target/release/desktop-receiver ${FLATPAK_DEST}/bin/fcast-receiver
      # Install metadata
      - install -Dm 0644 .flatpak/org.fcast.Receiver.desktop ${FLATPAK_DEST}/share/applications/org.fcast.Receiver.desktop
      - install -Dm 0644 .flatpak/org.fcast.Receiver.metainfo.xml  ${FLATPAK_DEST}/share/metainfo/org.fcast.Receiver.metainfo.xml
      # Install icons
      # receivers/electron/assets/icons/app/icon1024.png is the icon I think would best meet the store guidelines
      - mkdir -p ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps
      - ffmpeg -width 128 -i receivers/electron/assets/icons/app/icon1024.png -vf scale=128:-1 ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/org.fcast.Receiver.png

      - mkdir -p ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps
      - ffmpeg -width 256 -i receivers/electron/assets/icons/app/icon1024.png -vf scale=256:-1 ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/org.fcast.Receiver.png

      - mkdir -p ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps
      - ffmpeg -width 512 -i receivers/electron/assets/icons/app/icon1024.png -vf scale=512:-1 ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/org.fcast.Receiver.png
    post-install:
      - install -Dm0644 senders/extra/LICENSE-GPL -t ${FLATPAK_DEST}/share/licenses/$FLATPAK_ID/fcast-receiver
    sources:
      - type: git
        url: https://gitlab.futo.org/videostreaming/fcast.git
        commit: 34dfc43c5675e2533d3b86a91d7b7fb9662df773

        # x-checker-data:
        #   type: git
        #   url: https://gitlab.futo.org/videostreaming/fcast/-/tags
        #   tag-pattern: ^receiver-v([0-9.]+)$
        #   is-main-source: true

        # tag: receiver-v2.2.4
      - cargo-sources.json

      - type: file
        url: https://github.com/rust-skia/skia-binaries/releases/download/0.89.1/skia-binaries-b98dbc3ef012d6f67535-x86_64-unknown-linux-gnu-gl-pdf-textlayout-vulkan.tar.gz
        sha256: 692d0f450e7d7b0aac09ffb9f9b66c0f9f4a194a8b7a52b8db81d70577cc09ff
        dest: skia-binaries
