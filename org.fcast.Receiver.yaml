app-id: org.fcast.Receiver
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-nightly
  - org.freedesktop.Sdk.Extension.llvm20

command: fcast-receiver
finish-args:
  - --share=network
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: fcast-receiver
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-nightly/bin:/usr/lib/sdk/llvm20/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
      env:
        CARGO_HOME: /run/build/fcast-receiver/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo build --offline --release -p desktop-receiver --features static-gst-plugins
      - install -Dm0755 target/release/desktop-receiver ${FLATPAK_DEST}/bin/fcast-receiver

      # Install metadata
      - install -Dm 0644 .flatpak/org.fcast.Receiver.desktop ${FLATPAK_DEST}/share/applications/org.fcast.Receiver.desktop
      - install -Dm 0644 .flatpak/org.fcast.Receiver.metainfo.xml  ${FLATPAK_DEST}/share/metainfo/org.fcast.Receiver.metainfo.xml

      # Install icons
      - install -Dm0644 receivers/experimental/extra/icon128.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/org.fcast.Receiver.png
      - install -Dm0644 receivers/experimental/extra/icon256.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/org.fcast.Receiver.png
      - install -Dm0644 receivers/experimental/extra/icon512.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/org.fcast.Receiver.png
    post-install:
      - install -Dm0644 senders/extra/LICENSE-GPL -t ${FLATPAK_DEST}/share/licenses/$FLATPAK_ID/fcast-receiver
    sources:
      - type: git
        url: https://gitlab.futo.org/videostreaming/fcast.git
        commit: 432fe4fe24e373373033bc93f53137567c7bad3c
      - cargo-sources.json
